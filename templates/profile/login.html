{% extends "base.html" %}

{% block head %}
<title>Login</title>
{% endblock %}

{% block body %}
<h1 style="text-align:center;">Login</h1>

<form action="/login{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}" method="POST" style="max-width:420px; margin: 20px auto; display:flex; flex-direction:column; gap:12px;">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Your username" required value="{{ username|default('') }}" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; background-color: var(--surface); color: var(--text); box-sizing: border-box;">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••" required value="" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; background-color: var(--surface); color: var(--text); box-sizing: border-box;">

        <input type="submit" value="Sign In">
        {% if error %}
            <div style="color: var(--primary); font-weight:700; text-align:center; margin-top:8px;">{{ error }}</div>
        {% endif %}
        
        <div style="text-align:center; margin-top:12px;">
            Don't have an account? <a href="/register" style="color: var(--primary); text-decoration: none; font-weight: 600;">Create One</a>
        </div>
    </form>
{% endblock %}
