{% extends "base.html" %}

{% block head %}
<title>Register</title>
{% endblock %}

{% block body %}
<h1 style="text-align:center;">Create Account</h1>

<form action="/register" method="POST" style="max-width:420px; margin: 20px auto; display:flex; flex-direction:column; gap:12px;">
    <label for="username">Username *</label>
    <input type="text" id="username" name="username" placeholder="Choose a username" required value="{{ username|default('') }}" minlength="3" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; background-color: var(--surface); color: var(--text); box-sizing: border-box;">

    <label for="email">Email (optional)</label>
    <input type="email" id="email" name="email" placeholder="your@email.com" value="{{ email|default('') }}" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; background-color: var(--surface); color: var(--text); box-sizing: border-box;">

    <label for="password">Password *</label>
    <input type="password" id="password" name="password" placeholder="••••••" required minlength="6" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; background-color: var(--surface); color: var(--text); box-sizing: border-box;">

    <label for="password_confirm">Confirm Password *</label>
    <input type="password" id="password_confirm" name="password_confirm" placeholder="••••••" required minlength="6" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; background-color: var(--surface); color: var(--text); box-sizing: border-box;">

    <input type="submit" value="Create Account">
    
    {% if error %}
        <div style="color: var(--primary); font-weight:700; text-align:center; margin-top:8px;">{{ error }}</div>
    {% endif %}
    
    {% if success %}
        <div style="color: #4CAF50; font-weight:700; text-align:center; margin-top:8px;">{{ success }}</div>
    {% endif %}
    
    <div style="text-align:center; margin-top:12px;">
        Already have an account? <a href="/login" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign In</a>
    </div>
</form>
{% endblock %}
